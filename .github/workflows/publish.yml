name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start GCS emulator
        run: docker run -d -p 4443:4443 --name gcs-emulator fsouza/fake-gcs-server:1.56.1 -scheme http -backend memory
      - name: Wait for emulator
        run: until curl -sf http://localhost:4443/storage/v1/b; do sleep 1; done
        timeout-minutes: 1
      - run: npm run test:integration
      - name: Stop emulator
        if: always()
        run: docker rm -f gcs-emulator || true

  publish:
    needs: [typecheck, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Use npm with staged-publishing support
        run: npm install -g npm@11.19.1
      - run: npm --version
      - run: npm ci
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$VERSION" ] && [ "$RELEASE_TAG" != "$VERSION" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$VERSION'."
            exit 1
          fi
      - run: npm run build
      - name: Check committed dist is up to date
        run: git diff --exit-code -- dist/
      - name: Check package contents
        run: npm pack --dry-run
      - name: Stage package on npm
        run: npm stage publish --provenance --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
      - name: Add approval instructions to summary
        if: success()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "### npm staging complete"
            echo ""
            echo "Staged \`gcs-tar@$VERSION\` for the \`${{ github.event.release.prerelease && 'next' || 'latest' }}\` dist-tag."
            echo ""
            echo "A maintainer must approve it with 2FA from the npm Staged Packages tab:"
            echo "https://www.npmjs.com/package/gcs-tar"
          } >> "$GITHUB_STEP_SUMMARY"
