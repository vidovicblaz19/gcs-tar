name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start GCS emulator
        run: docker run -d -p 4443:4443 --name gcs-emulator fsouza/fake-gcs-server -scheme http
      - name: Wait for emulator
        run: until curl -sf http://localhost:4443/storage/v1/b; do sleep 1; done
        timeout-minutes: 1
      - run: npm run test:integration
      - name: Stop emulator
        if: always()
        run: docker rm -f gcs-emulator
